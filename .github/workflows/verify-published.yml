name: Verify published crate
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every crates.io version matches its tag
        run: |
          set -euo pipefail
          # crates.io can take a minute to serve a new version.
          for attempt in 1 2 3 4 5; do
            scripts/verify-published.sh && exit 0
            sleep 30
          done
          exit 1
